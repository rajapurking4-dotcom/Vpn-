name: Build Signed Release AAB and APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --force
          npm install @capacitor/cli --save-dev --force

      - name: Build Web App
        run: npm run build --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Decode Keystore file from Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      # Build Signed Release AAB and APK
      - name: Build Release Bundle and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/my-release-key.jks" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      # Upload AAB Artifact
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Upload Signed Release APK Artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Automatically Create GitHub Release when a tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

